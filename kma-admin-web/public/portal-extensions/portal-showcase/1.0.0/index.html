<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>站点洞察展示组件</title>
    <style>
      :root { color: #122c35; font-family: 'DM Sans', sans-serif; }
      body { margin: 0; background: transparent; }
      main { display: grid; gap: 12px; padding: 16px; border: 1px solid #cfe0dc; border-radius: 14px; background: #f7fbf9; }
      small { color: #27716b; font-weight: 700; letter-spacing: .08em; }
      h2, p { margin: 0; } h2 { font-size: 18px; } p { color: #567078; font-size: 13px; line-height: 1.55; }
      button { width: fit-content; padding: 8px 12px; border: 0; border-radius: 8px; background: #0f766e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; } li { padding: 8px; border-radius: 8px; background: #fff; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <small>PORTAL EXTENSION</small>
      <h2 id="title">知识洞察</h2>
      <p id="copy">正在连接受控门户 SDK。</p>
      <ul id="items"></ul>
      <button id="refresh" type="button">读取最新内容</button>
    </main>
    <script>
      let port
      let sequence = 0
      const pending = new Map()
      const invoke = (type, payload) => new Promise((resolve, reject) => {
        const id = `request-${++sequence}`
        pending.set(id, { resolve, reject })
        port.postMessage({ id, type, payload })
      })
      const render = async () => {
        try {
          const context = await invoke('page-context')
          document.getElementById('title').textContent = context.site.name
          document.getElementById('copy').textContent = `当前页面：${context.page} · 数据仅限当前已授权站点范围`
          const response = await invoke('contents')
          const list = response.list || response.records || []
          document.getElementById('items').innerHTML = list.slice(0, 3).map((item) => `<li>${String(item.title || item.name || '知识内容').replace(/[<>&]/g, '')}</li>`).join('') || '<li>暂无可展示内容</li>'
        } catch { document.getElementById('copy').textContent = '受控数据暂时不可用。' }
      }
      window.addEventListener('message', (event) => {
        if (event.data?.type !== 'kma-sdk-init' || !event.ports?.[0]) return
        port = event.ports[0]
        port.onmessage = (message) => {
          const result = message.data
          if (result?.type !== 'kma-sdk-result') return
          const request = pending.get(result.id)
          if (!request) return
          pending.delete(result.id)
          result.ok ? request.resolve(result.value) : request.reject(result.value)
        }
        render()
      })
      document.getElementById('refresh').addEventListener('click', () => { if (port) render() })
    </script>
  </body>
</html>
