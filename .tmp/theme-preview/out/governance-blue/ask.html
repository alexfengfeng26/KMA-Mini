<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' data:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><style>/* 政务知蓝 governance-blue — 参照 CMS 门户设计语言：oklch 设计令牌、粘性毛玻璃头部、分层渐变首屏、8px 间距体系 */

:root {
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --deep: oklch(30% 0.07 255);
  --accent: oklch(50% 0.12 250);
  --accent-strong: oklch(42% 0.11 252);
  --soft: oklch(94% 0.025 245);
  --bg: oklch(97% 0.008 245);
  --surface: oklch(99.5% 0.003 250);
  --ink: oklch(27% 0.035 255);
  --muted: oklch(47% 0.025 250);
  --line: oklch(89% 0.015 245);
  --on-deep: oklch(96% 0.015 250);
  --on-deep-muted: oklch(82% 0.03 250);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-card: 0 1px 2px oklch(30% 0.05 250 / 0.05), 0 8px 24px oklch(30% 0.05 250 / 0.06);
  --shadow-lift: 0 4px 8px oklch(30% 0.06 250 / 0.07), 0 16px 40px oklch(30% 0.06 250 / 0.12);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --container: 1240px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.kma-site {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* ---------- 头部 ---------- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  height: 64px;
  padding: 0 clamp(20px, 4vw, 48px);
  background: oklch(28% 0.065 255 / 0.97);
  border-bottom: 1px solid oklch(38% 0.06 252);
  backdrop-filter: blur(14px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(145deg, var(--accent), var(--accent-strong));
  color: var(--on-deep);
  font-size: 17px;
  font-weight: 700;
}

.brand-text { min-width: 0; }

.brand-text strong {
  display: block;
  overflow: hidden;
  color: var(--on-deep);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-text small {
  display: block;
  margin-top: 1px;
  color: var(--on-deep-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
}

.site-nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.site-nav::-webkit-scrollbar { display: none; }

.site-nav a {
  flex: none;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  color: var(--on-deep-muted);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 160ms var(--ease), color 160ms var(--ease);
}

.site-nav a:hover { background: oklch(100% 0 0 / 0.08); color: var(--on-deep); }

.site-nav a.active { background: oklch(100% 0 0 / 0.14); color: var(--on-deep); }

/* ---------- 主区 ---------- */

.site-main {
  width: 100%;
  max-width: var(--container);
  margin: 0 auto;
  padding: clamp(24px, 4vw, 48px) clamp(20px, 4vw, 48px) 64px;
}

/* ---------- 命令栏首屏（扁平横向：门户信息 + 检索条） ---------- */

.command-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
  padding: 8px 0 28px;
  border-bottom: 2px solid var(--deep);
}

.command-intro { min-width: 0; }

.kicker {
  margin: 0;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.command-intro h1 {
  margin: 6px 0 4px;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.command-intro > p:last-child {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.command-search {
  flex: 1 1 460px;
  max-width: 600px;
}

.search-strip {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.search-strip input {
  min-width: 0;
  min-height: 46px;
  padding: 0 16px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 15px;
}

.search-strip button {
  min-height: 46px;
  padding: 0 26px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--on-deep);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}

.search-strip button:hover { background: var(--accent-strong); }

.search-hint {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 12px;
}

/* 就地检索结果 */
.search-results {
  max-width: 860px;
  margin: 16px 0 0;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.search-result-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 12px 16px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}

.search-result-row:hover { background: var(--soft); }

.search-result-row strong { font-weight: 600; }

.search-result-row span {
  flex: none;
  color: var(--muted);
  font-size: 12px;
}

.search-empty {
  margin: 0;
  padding: 18px 16px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

/* 分类导航芯片 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.category-chip {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  text-decoration: none;
  cursor: pointer;
  transition: transform 160ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}

.category-chip:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-lift);
  transform: translateY(-2px);
}

.category-chip strong { color: var(--ink); font-size: 15px; }

.category-chip span {
  color: var(--accent);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

/* 工作台双栏：公报列表 + 侧栏 */
.workbench {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 32px;
  align-items: start;
}

.workbench-side {
  display: grid;
  gap: 20px;
  position: sticky;
  top: 88px;
}

.side-panel {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.side-panel .section-heading { margin-bottom: 12px; }

.side-panel .section-heading h2 { font-size: 19px; }

.side-topic-list { display: grid; }

.side-topic {
  display: grid;
  gap: 3px;
  padding: 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}

.side-topic:last-child { border-bottom: 0; }

.side-topic:hover { background: var(--soft); }

.side-topic strong { color: var(--ink); font-size: 14px; }

.side-topic span { color: var(--muted); font-size: 12px; line-height: 1.5; }

.quick-ask h2 { margin: 6px 0 8px; font-size: 19px; }

.quick-ask p:not(.kicker) { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }

.side-ask-link {
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.side-ask-link:hover { text-decoration: underline; text-underline-offset: 4px; }

/* 公报式发文列表 */
.bulletin-list {
  display: grid;
  margin: 0;
  padding: 0;
  border-top: 2px solid var(--deep);
  list-style: none;
  counter-reset: bulletin;
}

.bulletin-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 12px;
  border-bottom: 1px solid var(--line);
  counter-increment: bulletin;
  transition: background-color 160ms var(--ease);
}

.bulletin-row:hover { background: var(--surface); }

.bulletin-row::before {
  content: counter(bulletin, decimal-leading-zero);
  flex: none;
  width: 32px;
  color: var(--accent);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}

.bulletin-body { min-width: 0; flex: 1; }

.bulletin-body h3 {
  margin: 0 0 4px;
  color: var(--ink);
  font-size: 16.5px;
  font-weight: 700;
  line-height: 1.45;
}

.bulletin-body p {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.bulletin-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  color: var(--muted);
  font-size: 12px;
}

.bulletin-meta span + span::before,
.bulletin-meta time::before { content: "· "; color: var(--line); }

.bulletin-row > button {
  flex: none;
  min-height: 34px;
  padding: 6px 16px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 160ms var(--ease), color 160ms var(--ease);
}

.bulletin-row > button:hover { background: var(--accent); color: var(--on-deep); }

/* 专题行 */
.topic-row-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}

.topic-row {
  display: grid;
  gap: 6px;
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform 160ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}

.topic-row:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-lift);
  transform: translateY(-2px);
}

.topic-row strong { color: var(--ink); font-size: 16px; }

.topic-row span { color: var(--muted); font-size: 13px; line-height: 1.6; }

.topic-row i { color: var(--accent); font-size: 12px; font-style: normal; font-weight: 700; }

/* ---------- 章节 ---------- */

.section-block { margin-top: clamp(40px, 6vw, 64px); }

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.section-heading h2 {
  margin: 8px 0 0;
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.section-more {
  flex: none;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.section-more:hover { text-decoration: underline; text-underline-offset: 4px; }

/* ---------- 页头 ---------- */

.page-title {
  max-width: 720px;
  margin-bottom: clamp(24px, 4vw, 40px);
}

.page-title h1 {
  margin: 10px 0 0;
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.page-sub {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.breadcrumb { margin-bottom: 20px; }

.breadcrumb a {
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

.breadcrumb a:hover { text-decoration: underline; text-underline-offset: 4px; }

/* ---------- 内容卡片（widget 输出） ---------- */

.kma-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms var(--ease);
}

.kma-card:hover {
  border-color: oklch(72% 0.06 247);
  box-shadow: var(--shadow-lift);
  transform: translateY(-2px);
}

.kma-card h3 {
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
}

.kma-card h2 { margin: 0 0 8px; font-size: 19px; }

.kma-card p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.7;
}

.kma-card p:last-child { margin-bottom: 0; }

.kma-card button {
  align-self: flex-start;
  margin-top: auto;
  min-height: 36px;
  padding: 7px 16px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 160ms var(--ease), color 160ms var(--ease);
}

.kma-card button:hover { background: var(--accent); color: var(--on-deep); }

/* ---------- AI 问答（widget 输出） ---------- */

.kma-ai {
  max-width: 820px;
  padding: clamp(20px, 3vw, 32px);
  gap: 16px;
}

.kma-ai:hover { transform: none; border-color: var(--line); box-shadow: var(--shadow-card); }

.kma-ai textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}

.kma-ai textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--soft);
  background: var(--surface);
}

.kma-ai button {
  align-self: flex-end;
  min-height: 42px;
  padding: 10px 24px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--on-deep);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}

.kma-ai button:hover { background: var(--accent-strong); }

.kma-ai pre {
  min-height: 72px;
  margin: 0;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--soft);
  color: var(--ink);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.kma-ai pre:empty { display: none; }

/* ---------- 文档阅读（widget 输出） ---------- */

.kma-document {
  max-width: 780px;
  margin: 0 auto;
  padding: clamp(28px, 4vw, 48px);
}

.kma-document:hover { transform: none; border-color: var(--line); box-shadow: var(--shadow-card); }

.kma-document h1 {
  margin: 0 0 12px;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.35;
}

.kma-document > p {
  margin: 0 0 8px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 15px;
}

.kma-document section {
  padding: 20px 4px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: 15.5px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.kma-document section:last-child { border-bottom: 0; }

/* ---------- 页脚 ---------- */

.site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: var(--container);
  width: 100%;
  margin: 0 auto;
  padding: 24px clamp(20px, 4vw, 48px);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}

.site-footer p { margin: 0; }

/* ---------- 可访问性与动效 ---------- */

:where(a, button, textarea):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.masthead :where(a):focus-visible { outline-color: oklch(85% 0.06 235); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .kma-card:hover, .category-chip:hover, .topic-row:hover { transform: none; }
}

/* ---------- 响应式 ---------- */

@media (max-width: 960px) {
  .masthead { gap: 16px; height: 60px; }
  .brand-text small { display: none; }
  .site-nav a { padding: 8px 10px; font-size: 13px; }
  .command-band { align-items: stretch; flex-direction: column; gap: 18px; }
  .command-search { flex-basis: auto; max-width: none; }
  .workbench { grid-template-columns: 1fr; }
  .workbench-side { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
}

@media (max-width: 720px) {
  .search-strip { grid-template-columns: 1fr; gap: 6px; }
  .search-strip input { min-height: 44px; }
  .section-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
  .bulletin-row { align-items: flex-start; flex-direction: column; gap: 10px; }
  .bulletin-row::before { width: auto; }
  .site-footer { flex-direction: column; align-items: flex-start; gap: 4px; }
}

/* ---------- 流式问答 ---------- */

.chat-shell { max-width: 860px; margin: 0 auto; }

.chat-welcome { padding: clamp(36px, 6vw, 72px) 24px; text-align: center; }

.chat-welcome h1 {
  margin: 12px 0;
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.welcome-sub {
  max-width: 46ch;
  margin: 0 auto;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.suggest-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 24px;
}

.suggest {
  padding: 9px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 160ms var(--ease), color 160ms var(--ease);
}

.suggest:hover { border-color: var(--accent); color: var(--accent); }

.chat-messages { display: grid; gap: 18px; padding: 8px 0 24px; }

.msg.user { display: flex; justify-content: flex-end; }

.msg.user .msg-body {
  max-width: 78%;
  padding: 12px 18px;
  border-radius: 16px 16px 4px 16px;
  background: var(--accent);
  color: var(--on-deep);
  font-size: 14.5px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.msg.assistant {
  display: grid;
  gap: 10px;
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: 4px 16px 16px 16px;
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.msg-status { margin: 0; color: var(--muted); font-size: 12px; }

.msg-status.error { color: oklch(52% 0.14 25); }

.msg.assistant .msg-body {
  color: var(--ink);
  font-size: 15px;
  line-height: 1.85;
  white-space: pre-wrap;
}

.msg-body.streaming::after {
  content: "▍";
  color: var(--accent);
  animation: caret-blink 1s steps(2) infinite;
}

.citations { display: grid; gap: 8px; }

<script>
(() => {
  let port; let sequence = 0; let navigationPending = false; const pending = new Map();
  const request = (type, payload, onEvent) => new Promise((resolve, reject) => {
    if (!port) return reject(new Error('PORTAL_SDK_UNAVAILABLE'));
    const id = 'theme-' + (++sequence); pending.set(id,{resolve,reject,onEvent});
    port.postMessage({id,type,payload});
  });
  addEventListener('message', event => {
    if(event.data?.type!=='kma-theme-init'||!event.ports[0]) return;
    port=event.ports[0]; port.onmessage=event=>{
      const call=pending.get(event.data?.id); if(!call)return;
      if(event.data.done===false){ if(call.onEvent)call.onEvent(event.data.value); return; }
      pending.delete(event.data.id);
      event.data.ok?call.resolve(event.data.value):call.reject(event.data.value);
    }; dispatchEvent(new Event('portal-sdk-ready'));
  });
  window.portal=Object.freeze({
    context:{get:()=>request('portal.context.get')},
    data:{query:(query)=>request('portal.data.query',query)},
    navigation:{
      go:(target)=>request('portal.navigation.go',String(target||'')),
      replace:(target)=>request('portal.navigation.replace',String(target||'')),
      back:()=>request('portal.navigation.back')
    },
    search:{query:(value)=>request('portal.search.query',String(value||''))},
    ask:{
      submit:(value)=>request('portal.ask.submit',String(value||'')),
      stream:(value,onEvent)=>request('portal.ask.stream',value,onEvent)
    },
    content:{open:(id)=>request('portal.content.open',String(id||''))},
    analytics:{track:(value)=>request('portal.analytics.track',value)}
  });
  const navigate = target => {
    if(navigationPending) return;
    navigationPending=true;
    window.portal.navigation.go(target).catch(()=>{navigationPending=false});
  };
  document.addEventListener('click',event=>{
    const target=event.target instanceof Element ? event.target : null; if(!target)return;
    const nav=target.closest('[data-kma-nav]'); if(nav){event.preventDefault();navigate(nav.dataset.kmaNav);return;}
    const content=target.closest('[data-kma-content]'); if(content){event.preventDefault();if(!navigationPending){navigationPending=true;window.portal.content.open(content.dataset.kmaContent).catch(()=>{navigationPending=false});}return;}
    const topic=target.closest('[data-kma-topic]'); if(topic){event.preventDefault();navigate('topics?topic='+encodeURIComponent(topic.dataset.kmaTopic));}
  });
  document.addEventListener('click',async event=>{
    if(event.target?.id!=='kma-ai-submit')return;
    const query=document.querySelector('#kma-ai-query')?.value||''; const answer=document.querySelector('#kma-ai-answer');
    if(answer)answer.textContent='正在检索资料并生成回答…';
    try{const value=await window.portal.ask.submit(query);if(answer)answer.textContent=value?.answer||JSON.stringify(value,null,2)}
    catch(error){if(answer)answer.textContent=error?.message||error?.code||'回答失败，请稍后重试'}
  });
})();</script><script type="module">document.documentElement.dataset.themePreset = 'governance-blue'

let sdkReady = false

// 依据当前页面高亮主导航（page-context 能力不可用时保持静态）
window.addEventListener('portal-sdk-ready', () => {
  sdkReady = true
  window.portal.context.get()
    .then((context) => {
      const slug = context && context.page && context.page.slug ? context.page.slug : 'home'
      const current = slug === 'content' ? 'library' : slug
      document.querySelectorAll('.site-nav [data-kma-nav]').forEach((link) => {
        link.classList.toggle('active', link.dataset.kmaNav === current)
      })
    })
    .catch(() => {})
})

// ---------- 首页检索条（受控搜索能力，就地渲染结果） ----------

const govInput = document.querySelector('#gov-search')
const govSubmit = document.querySelector('#gov-search-submit')
const govResults = document.querySelector('#gov-search-results')

if (govInput && govSubmit && govResults) {
  const showMessage = (text) => {
    govResults.hidden = false
    govResults.replaceChildren()
    const message = document.createElement('p')
    message.className = 'search-empty'
    message.textContent = text
    govResults.append(message)
  }

  const render = (payload) => {
    const list = Array.isArray(payload) ? payload : payload && Array.isArray(payload.list) ? payload.list : []
    const usable = list.filter((entry) => entry && entry.title)
    if (!usable.length) {
      showMessage('没有检索到匹配的资料，换个关键词试试。')
      return
    }
    govResults.hidden = false
    govResults.replaceChildren()
    usable.slice(0, 8).forEach((entry) => {
      const id = entry.contentId !== undefined ? entry.contentId : entry.docId !== undefined ? entry.docId : entry.id
      const row = document.createElement('button')
      row.type = 'button'
      row.className = 'search-result-row'
      if (id !== undefined && id !== null) row.dataset.kmaContent = String(id)
      const title = document.createElement('strong')
      title.textContent = String(entry.title)
      row.append(title)
      const meta = document.createElement('span')
      meta.textContent = [entry.issuingAuthority, entry.publishDate].filter(Boolean).join(' · ')
      row.append(meta)
      govResults.append(row)
    })
  }

  const run = () => {
    const value = govInput.value.trim()
    if (!value) return
    showMessage('正在检索门户资料…')
    window.portal.search.query(value)
      .then(render)
      .catch(() => showMessage('检索失败，请稍后重试。'))
  }

  govSubmit.addEventListener('click', run)
  govInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') run()
  })
}

// ---------- 流式问答（问答页） ----------

const chatMessages = document.querySelector('#chat-messages')
const chatInput = document.querySelector('#chat-input')
const chatSend = document.querySelector('#chat-send')

if (chatMessages && chatInput && chatSend) {
  let sessionId
  let streaming = false

  const el = (tag, className, text) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined) node.textContent = text
    return node
  }

  const scrollToEnd = () => {
    const last = chatMessages.lastElementChild
    if (last) last.scrollIntoView({ block: 'end' })
  }

  const autogrow = () => {
    chatInput.style.height = 'auto'
    chatInput.style.height = Math.min(chatInput.scrollHeight, 168) + 'px'
  }

  const setStreaming = (flag) => {
    streaming = flag
    chatSend.disabled = flag
    chatSend.textContent = flag ? '回答中…' : '发送'
  }

  const addUserMessage = (text) => {
    const msg = el('div', 'msg user')
    msg.append(el('div', 'msg-body', text))
    chatMessages.append(msg)
    scrollToEnd()
  }

  const addAssistantMessage = () => {
    const msg = el('div', 'msg assistant')
    const status = el('p', 'msg-status', '正在检索资料…')
    const body = el('div', 'msg-body')
    const citations = el('div', 'citations')
    msg.append(status, body, citations)
    chatMessages.append(msg)
    scrollToEnd()
    return { msg, status, body, citations }
  }

  const renderCitations = (container, items) => {
    container.replaceChildren()
    ;(Array.isArray(items) ? items : []).forEach((item, index) => {
      if (!item || !(item.docTitle || item.title)) return
      const card = el('button', 'citation-card')
      card.type = 'button'
      const docId = item.docId !== undefined ? item.docId : item.contentId
      if (docId !== undefined && docId !== null) card.dataset.kmaContent = String(docId)
      card.append(el('span', 'citation-no', String(index + 1)))
      const main = el('span', 'citation-main')
      main.append(el('strong', '', item.docTitle || item.title))
      const meta = [item.issuingAuthority, item.sourceTag].filter(Boolean).join(' · ')
      if (meta) main.append(el('span', 'citation-meta', meta))
      if (item.content) main.append(el('span', 'citation-snippet', String(item.content).slice(0, 90)))
      card.append(main)
      container.append(card)
    })
  }

  const whenReady = () => sdkReady
    ? Promise.resolve()
    : new Promise((resolve) => window.addEventListener('portal-sdk-ready', resolve, { once: true }))

  const send = async (text) => {
    const query = String(text || '').trim()
    if (!query || streaming) return
    await whenReady()
    const welcome = chatMessages.querySelector('.chat-welcome')
    if (welcome) welcome.remove()
    addUserMessage(query)
    chatInput.value = ''
    autogrow()
    setStreaming(true)
    const view = addAssistantMessage()
    let received = false

    const finish = () => {
      view.body.classList.remove('streaming')
      setStreaming(false)
      chatInput.focus()
    }
    const fail = (error) => {
      view.status.hidden = false
      view.status.textContent = (error && error.message) || '回答失败，请稍后重试'
      view.status.classList.add('error')
      const retry = el('button', 'retry-button', '重试')
      retry.type = 'button'
      retry.addEventListener('click', () => {
        view.msg.remove()
        send(query)
      })
      view.msg.append(retry)
      finish()
    }
    const onEvent = (event) => {
      if (!event || !event.kind) return
      if (event.kind === 'citations') {
        view.status.textContent = event.items.length ? '已找到 ' + event.items.length + ' 条出处' : '未检索到直接出处'
        renderCitations(view.citations, event.items)
        scrollToEnd()
      } else if (event.kind === 'delta') {
        if (!received) { received = true; view.status.hidden = true }
        view.body.textContent += event.text
        view.body.classList.add('streaming')
        scrollToEnd()
      } else if (event.kind === 'done') {
        if (event.sessionId) sessionId = event.sessionId
      } else if (event.kind === 'error') {
        view.status.hidden = false
        view.status.textContent = '回答失败：' + (event.message || '请稍后重试')
        view.status.classList.add('error')
      }
    }
    const payload = { query }
    if (sessionId) payload.sessionId = sessionId

    window.portal.ask.stream(payload, onEvent)
      .then(finish)
      .catch((error) => {
        if (error && error.code === 'SDK_CAPABILITY_FORBIDDEN') {
          // 宿主不支持流式时退回一次性问答（结果同样带引用）
          view.status.textContent = '正在生成回答…'
          window.portal.ask.submit(query)
            .then((result) => {
              renderCitations(view.citations, result && result.citations)
              view.status.hidden = true
              view.body.textContent = (result && result.answer) || '未获得回答'
              if (result && result.sessionId) sessionId = result.sessionId
              finish()
            })
            .catch(fail)
        } else fail(error)
      })
  }

  chatSend.addEventListener('click', () => send(chatInput.value))
  chatInput.addEventListener('input', autogrow)
  chatInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault()
      send(chatInput.value)
    }
  })
  document.querySelectorAll('.suggest').forEach((chip) => {
    chip.addEventListener('click', () => send(chip.textContent))
  })
}
</script><script>
window.portal = Object.freeze({
  context: { get: () => Promise.resolve({ page: { slug: 'ask' } }) },

        { docId: 106, docTitle: '政务服务窗口人员行为准则与考核办法', sourceTag: '制度规范', issuingAuthority: '政务服务局', content: '明确首问负责、一次性告知、限时办结等服务规范及配套考核指标。' },
