<header class="page-title">
  <p class="kicker">My Collection</p>
  <h1>我的收藏</h1>
  <p class="page-sub">已收藏的资料，可随时回看与引用。</p>
</header>
<ol class="bulletin-list">
  {% for fav in favorites %}
  <li class="bulletin-row">
    <div class="bulletin-body">
      <h3>{{ fav.title }}</h3>
      <div class="bulletin-meta">
        <span>{{ fav.issuingAuthority }}</span>
        <time>收藏于 {{ fav.lastReadAt }}</time>
      </div>
    </div>
    <button type="button" data-kma-content="{{ fav.docId }}">查阅</button>
  </li>
  {% endfor %}
</ol>
