<section class="chat-shell">
  <div class="chat-messages" id="chat-messages">
    <div class="chat-welcome">
      <h1>AI 问答</h1>
      <p class="welcome-sub">基于收录资讯作答，回答附出处。多轮追问会保留上下文。</p>
      <div class="suggest-row">
        <button type="button" class="suggest">今天的头条资讯讲了什么？</button>
        <button type="button" class="suggest">数据共享有哪些管理规定？</button>
        <button type="button" class="suggest">基层治理有哪些典型案例？</button>
      </div>
    </div>
  </div>
  <div class="chat-dock">
    <textarea id="chat-input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="chat-send" type="button">发送</button>
  </div>
</section>
