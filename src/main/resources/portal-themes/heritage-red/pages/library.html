<header class="page-title">
  <p class="kicker">Knowledge Library</p>
  <h1>资料中心</h1>
  <p class="page-sub">党章党规、政策文件与学习材料的完整收录。</p>
</header>
<div class="archive-list">
  {% for item in recent %}
  <article class="archive-row">
    <h3>{{ item.title }}</h3>
    <div class="archive-meta">
      <span>{{ item.issuingAuthority }}</span>
      {% if item.documentNumber %}<span>{{ item.documentNumber }}</span>{% endif %}
      <time>{{ item.publishDate }}</time>
    </div>
    <button type="button" data-kma-content="{{ item.contentId }}">阅读原文</button>
  </article>
  {% endfor %}
</div>
