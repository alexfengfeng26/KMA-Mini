<header class="page-title">
  <p class="kicker">Topics</p>
  <h1>主题导航</h1>
  <p class="page-sub">按主题浏览文档与问答范围。</p>
</header>
<div class="doc-card-grid">
  {% for topic in topics %}
  <button type="button" class="doc-card" data-kma-topic="{{ topic.topicCode }}">
    <span class="doc-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /><path d="M9 13h6M9 17h4" /></svg></span>
    <strong>{{ topic.name }}</strong>
    <span class="doc-desc">{{ topic.description | truncate: 64 }}</span>
  </button>
  {% endfor %}
</div>
