<section class="chat-shell">
  <div class="chat-messages" id="chat-messages">
    <div class="chat-welcome">
      <p class="kicker">Help Assistant</p>
      <h1>AI 问答</h1>
      <p class="welcome-sub">基于帮助中心收录的文档作答，回答附引用出处。多轮追问会保留上下文。</p>
      <div class="suggest-row">
        <button type="button" class="suggest">如何快速查找一份政策文件？</button>
        <button type="button" class="suggest">数据共享的办理流程是什么？</button>
        <button type="button" class="suggest">公文写作有哪些格式要求？</button>
      </div>
    </div>
  </div>
  <div class="chat-dock">
    <textarea id="chat-input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="chat-send" type="button">发送</button>
  </div>
</section>
