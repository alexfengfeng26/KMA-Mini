<section class="hero">
  <h1>{{ site.name }} 帮助中心</h1>
  <p class="hero-sub">文档、主题导航与 AI 问答都在这里。输入关键词直接检索，或按主题浏览全部收录内容。</p>
  <div class="hero-actions">
    <a href="#" data-kma-nav="library" class="btn-primary">快速开始</a>
    <a href="#" data-kma-nav="ask" class="btn-ghost">AI 问答</a>
  </div>
  <div class="search-strip">
    <input id="help-search" type="text" placeholder="搜索文档、政策、案例…" />
    <button id="help-search-submit" type="button">搜索</button>
  </div>
</section>
<div id="help-search-results" class="search-results" hidden></div>
<section class="section-block">
  <header class="section-heading">
    <h2>主题文档</h2>
    <a href="#" data-kma-nav="topics" class="section-more">全部主题 →</a>
  </header>
  <div class="doc-card-grid">
    {% for topic in topics %}
    <button type="button" class="doc-card" data-kma-topic="{{ topic.topicCode }}">
      <span class="doc-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /><path d="M9 13h6M9 17h4" /></svg></span>
      <strong>{{ topic.name }}</strong>
      <span class="doc-desc">{{ topic.description | truncate: 64 }}</span>
    </button>
    {% endfor %}
  </div>
</section>
<section class="section-block">
  <header class="section-heading">
    <h2>热门文档</h2>
    <a href="#" data-kma-nav="library" class="section-more">进入文档库 →</a>
  </header>
  <div class="hot-grid">
    {% for item in recent %}
    <button type="button" class="hot-link" data-kma-content="{{ item.contentId }}">
      <span>{{ item.title }}</span>
      <i>→</i>
    </button>
    {% endfor %}
  </div>
</section>
<section class="cta-banner">
  <h2>找不到答案？</h2>
  <p>向 AI 提问，基于收录文档生成带引用的回答。</p>
  <a href="#" data-kma-nav="ask" class="btn-primary">发起 AI 问答</a>
</section>
