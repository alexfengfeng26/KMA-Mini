<header class="page-title">
  <p class="kicker">Search Results</p>
  <h1>搜索结果</h1>
  <p class="page-sub">与当前检索条件匹配的资料。</p>
</header>
<ul class="quiet-list quiet-list-roomy">
  {% for item in recent %}
  <li>
    <button type="button" data-kma-content="{{ item.contentId }}">
      <strong>{{ item.title }}</strong>
      <em>{{ item.issuingAuthority }} · {{ item.publishDate }}</em>
    </button>
  </li>
  {% endfor %}
</ul>
