<section class="chat-shell">
  <div class="chat-messages" id="chat-messages">
    <div class="chat-welcome">
      <p class="kicker">Ask the Archive</p>
      <h1>问答</h1>
      <p class="welcome-sub">向收录的资料提问，回答附出处。多轮追问会保留上下文，像夜读时与馆员交谈。</p>
      <div class="suggest-row">
        <button type="button" class="suggest">最近收录的资料讲了什么？</button>
        <button type="button" class="suggest">帮我梳理数据共享的管理要点</button>
        <button type="button" class="suggest">有哪些值得重读的治理案例？</button>
      </div>
    </div>
  </div>
  <div class="chat-dock">
    <textarea id="chat-input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="chat-send" type="button">发送</button>
  </div>
</section>
