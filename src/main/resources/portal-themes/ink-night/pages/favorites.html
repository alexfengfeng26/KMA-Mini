<header class="page-title">
  <p class="kicker">Bookmarks</p>
  <h1>书签</h1>
  <p class="page-sub">标记过的资料，留待重读。</p>
</header>
<ul class="quiet-list quiet-list-roomy">
  {% for fav in favorites %}
  <li>
    <button type="button" data-kma-content="{{ fav.docId }}">
      <strong>{{ fav.title }}</strong>
      <em>{{ fav.issuingAuthority }} · 收藏于 {{ fav.lastReadAt }}</em>
    </button>
  </li>
  {% endfor %}
</ul>
